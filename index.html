<title>Reelwright</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#10302e;--mute:#587270;--line:#d3ddda;--accent:#e8553d;--onaccent:#fff;--warn:#b4232c;--ok:#1f7a4d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b1a;--panel:#162725;--ink:#e6f1ef;--mute:#98b2ae;--line:#2a403d;--accent:#ff7a62;--onaccent:#2a0c06;--warn:#ff8a90;--ok:#6fd6a0}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
h1{font-size:28px;line-height:1.1;margin:4px 0 12px;font-weight:800;letter-spacing:-.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.lab{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.lab.first{margin-top:0}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:96px;resize:vertical}
button,input,textarea,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.main{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.big{width:100%;margin-top:16px;font-size:17px;font-weight:800;padding:14px;border-radius:12px}
.btn:disabled{opacity:.6;cursor:progress}
.btn.del{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{font-size:14px;margin:10px 0 0;min-height:20px;color:var(--mute)}
.msg.err{color:var(--warn)}
.msg.ok{color:var(--ok)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);cursor:pointer}
.drop img{max-width:100%;max-height:150px;border-radius:8px;display:block;margin:0 auto 6px}
.out{margin-top:14px}
.out img,.out video{width:100%;border-radius:10px;display:block;background:#000;max-height:70vh;object-fit:contain}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:13px;padding:14px 4px;cursor:pointer}
nav button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1;position:relative;cursor:pointer}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.gal .tag{position:absolute;left:6px;bottom:6px;font-size:11px;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 6px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.viewer img,.viewer video{max-width:100%;max-height:68vh;border-radius:10px}
.viewer p{color:#fff;max-width:520px;margin:0;font-size:14px;text-align:center}
.frame{width:100%;border-radius:10px;overflow:hidden;position:relative;background:#000;container-type:inline-size;margin:0 auto}
.frame .bg,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kb{animation:kb var(--d,4s) ease-in-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.cap{position:absolute;left:0;right:0;bottom:8%;text-align:center;padding:0 8%}
.cap span{display:inline-block;color:#fff;font-weight:800;font-size:5.2cqw;line-height:1.2;background:rgba(0,0,0,.45);padding:.2em .5em;border-radius:.3em}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.ctl{display:flex;gap:10px;align-items:center;margin-top:10px}
.tog{display:flex;gap:16px;margin-top:8px;font-size:14px}
.tog label{display:flex;gap:6px;align-items:center}
.tog input{accent-color:var(--accent)}
@media(prefers-reduced-motion:reduce){.kb{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">Create</h1>

  <section id="v-create">
    <div class="panel">
      <span class="lab first">What do you want to make?</span>
      <div class="chips" id="mode">
        <button aria-pressed="true" data-v="t2i">Image</button>
        <button aria-pressed="false" data-v="t2v">Text to video</button>
        <button aria-pressed="false" data-v="i2v">Image to video</button>
      </div>
      <div id="imgBox" hidden>
        <span class="lab">Starting image</span>
        <label class="drop" id="drop"><span>Tap to choose an image</span><input type="file" accept="image/*" id="file" hidden></label>
      </div>
      <label class="lab" for="prompt" id="pl">Prompt</label>
      <textarea id="prompt" placeholder="A lighthouse on a cliff at dusk, waves crashing below"></textarea>
      <span class="lab">Shape</span>
      <div class="chips" id="shape"><button aria-pressed="true" data-v="1:1">Square</button><button aria-pressed="false" data-v="16:9">Wide</button><button aria-pressed="false" data-v="9:16">Tall</button></div>
      <div id="lenBox" hidden>
        <span class="lab">Length</span>
        <div class="chips" id="len"><button aria-pressed="true" data-v="5">5 seconds</button><button aria-pressed="false" data-v="10">10 seconds</button></div>
      </div>
      <button class="btn main big" id="go">Generate image</button>
      <p class="msg" id="msg" role="status"></p>
      <div class="out" id="out"></div>
    </div>
  </section>

  <section id="v-story" hidden>
    <div class="panel">
      <label class="lab first" for="script">Script (one line per scene, up to 10)</label>
      <textarea id="script" placeholder="A small robot wakes up in an empty workshop.&#10;It finds a flower growing through the floor.&#10;It decides to protect it."></textarea>
      <span class="lab">Look</span>
      <div class="chips" id="sstyle"><button aria-pressed="true" data-v="cinematic photo, dramatic lighting">Cinematic</button><button aria-pressed="false" data-v="flat vector illustration, bold colors">Illustration</button><button aria-pressed="false" data-v="3D render, soft studio lighting">3D</button></div>
      <span class="lab">Shape</span>
      <div class="chips" id="sshape"><button aria-pressed="false" data-v="16:9">Wide</button><button aria-pressed="true" data-v="9:16">Tall</button><button aria-pressed="false" data-v="1:1">Square</button></div>
      <button class="btn main big" id="sgo">Create story</button>
      <p class="msg" id="smsg" role="status"></p>
    </div>
    <div class="panel" id="player" hidden>
      <div class="frame" id="frame"></div>
      <div class="ctl"><button class="btn main" id="play">Play</button><div class="prog"><i id="pb"></i></div></div>
      <div class="tog"><label><input type="checkbox" id="voice" checked> Voiceover</label><label><input type="checkbox" id="caps" checked> Captions</label></div>
    </div>
  </section>

  <section id="v-lib" hidden>
    <div class="panel"><div class="gal" id="gal"></div><p class="msg" id="libmsg"></p></div>
  </section>

  <section id="v-set" hidden>
    <div class="panel">
      <label class="lab first" for="key">fal.ai API key</label>
      <input type="password" id="key" autocomplete="off" placeholder="Paste your key here">
      <p class="msg">Your key is stored only on this phone and is sent only to fal.ai. Video costs money per second, so check your fal.ai balance.</p>
      <label class="lab" for="m-t2i">Image model</label><input type="text" id="m-t2i" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label class="lab" for="m-t2v">Text-to-video model</label><input type="text" id="m-t2v" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label class="lab" for="m-i2v">Image-to-video model</label><input type="text" id="m-i2v" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p class="msg">If a model name returns an error, copy a current model ID from fal.ai/models and paste it here.</p>
      <div class="row"><button class="btn main" id="save">Save settings</button><button class="btn del" id="wipe">Remove key</button></div>
      <p class="msg" id="setmsg" role="status"></p>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-v="create" aria-current="true">Create</button>
  <button data-v="story" aria-current="false">Story</button>
  <button data-v="lib" aria-current="false">Library</button>
  <button data-v="set" aria-current="false">Settings</button>
</nav>
<div class="viewer" id="viewer" hidden></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var DEF={key:'',t2i:'fal-ai/flux/schnell',t2v:'fal-ai/kling-video/v4/text-to-video',i2v:'fal-ai/kling-video/v2.5-turbo/standard/image-to-video'};
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var cfg=Object.assign({},DEF,lsGet('rw_cfg',{})),lib=lsGet('rw_lib',[]),mode='t2i',imgData=null,busy=false;
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  function pressed(g){return g.querySelector('[aria-pressed="true"]').dataset.v}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function say(el,t,c){el.textContent=t;el.className='msg'+(c?' '+c:'')}

  document.querySelectorAll('.chips').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})})});

  /* navigation */
  var titles={create:'Create',story:'Story',lib:'Library',set:'Settings'};
  $('nav').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var v=b.dataset.v;
    stopPlay();
    ['create','story','lib','set'].forEach(function(n){$('v-'+n).hidden=n!==v});
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-current',x===b)});
    $('title').textContent=titles[v];
    if(v==='lib')renderLib();
    window.scrollTo(0,0);
  });

  /* settings */
  function fillSettings(){$('key').value=cfg.key;['t2i','t2v','i2v'].forEach(function(k){$('m-'+k).value=cfg[k]})}
  fillSettings();
  $('save').addEventListener('click',function(){
    cfg.key=$('key').value.trim();
    ['t2i','t2v','i2v'].forEach(function(k){cfg[k]=$('m-'+k).value.trim()||DEF[k]});
    var saved=lsSet('rw_cfg',cfg);
    say($('setmsg'),saved?'Saved.':'Could not save on this device.',saved?'ok':'err');fillSettings();
  });
  $('wipe').addEventListener('click',function(){cfg.key='';lsSet('rw_cfg',cfg);fillSettings();say($('setmsg'),'Key removed from this phone.','ok')});

  /* fal.ai queue client */
  async function errText(r){
    var t='';try{t=await r.text();var j=JSON.parse(t),d=j.detail;t=typeof d==='string'?d:Array.isArray(d)?d.map(function(x){return(x.loc?x.loc.join('.')+': ':'')+(x.msg||'')}).join('; '):(j.message||t)}catch(e){}
    if(r.status===401||r.status===403)return'fal.ai rejected your key ('+r.status+'). Check it in Settings.';
    return'Error '+r.status+(t?': '+String(t).slice(0,300):'');
  }
  async function run(model,input,onStatus){
    var h={'Authorization':'Key '+cfg.key,'Content-Type':'application/json'};
    var r=await fetch('https://queue.fal.run/'+model,{method:'POST',headers:h,body:JSON.stringify(input)});
    if(!r.ok){var e=new Error(await errText(r));e.status=r.status;throw e}
    var j=await r.json(),end=Date.now()+12*60000;
    while(Date.now()<end){
      await sleep(2500);
      var s=await fetch(j.status_url,{headers:h});
      if(!s.ok)throw new Error(await errText(s));
      var sj=await s.json();
      onStatus(sj.status==='IN_QUEUE'?'Waiting in the queue…':'Generating…');
      if(sj.status==='COMPLETED'){var rr=await fetch(j.response_url,{headers:h});if(!rr.ok)throw new Error(await errText(rr));return rr.json()}
    }
    throw new Error('Timed out after 12 minutes. Try again.');
  }
  async function runSafe(model,input,onStatus){
    try{return await run(model,input,onStatus)}
    catch(e){
      if(e.status===422&&input.duration!=null&&/duration/i.test(e.message)){input.duration=String(input.duration);return run(model,input,onStatus)}
      if(e instanceof TypeError)throw new Error('Could not reach fal.ai. Check your internet connection.');
      throw e;
    }
  }
  function fileUrl(o){return(o.video&&o.video.url)||(o.images&&o.images[0]&&o.images[0].url)||(o.image&&o.image.url)||null}

  /* create */
  var labels={t2i:'Generate image',t2v:'Generate video',i2v:'Animate image'};
  var holders={t2i:'A lighthouse on a cliff at dusk, waves crashing below',t2v:'Paper boats drifting down a rainy street at night',i2v:'Slow push in, clouds rolling past, leaves swaying'};
  $('mode').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||busy)return;mode=b.dataset.v;
    $('imgBox').hidden=mode!=='i2v';$('lenBox').hidden=mode==='t2i';
    $('go').textContent=labels[mode];$('prompt').placeholder=holders[mode];
    $('pl').textContent=mode==='i2v'?'How should it move? (optional)':'Prompt';
    say($('msg'),'');
  });
  function resizeImage(file){return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var m=1280,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.9))};
    im.onerror=function(){rej(new Error('That file could not be read as an image.'))};im.src=u})}
  async function onFile(){
    var f=this.files[0];if(!f)return;
    try{imgData=await resizeImage(f);$('drop').innerHTML='<img alt="Chosen image" src="'+imgData+'"><span>Tap to change</span><input type="file" accept="image/*" id="file" hidden>';
      $('file').addEventListener('change',onFile)}catch(e){say($('msg'),e.message,'err')}
  }
  $('file').addEventListener('change',onFile);
  function mediaEl(url,kind,ctl){return kind==='image'?'<img alt="Generated image" src="'+esc(url)+'">':'<video src="'+esc(url)+'" '+(ctl?'controls ':'muted ')+'playsinline loop '+(ctl?'':'')+'></video>'}
  function addLib(item){lib.unshift(item);lib=lib.slice(0,60);lsSet('rw_lib',lib)}

  $('go').addEventListener('click',async function(){
    if(busy)return;var m=$('msg'),prompt=$('prompt').value.trim();
    if(!cfg.key){say(m,'Add your fal.ai key in Settings first.','err');return}
    if(mode==='i2v'&&!imgData){say(m,'Choose a starting image first.','err');return}
    if(mode!=='i2v'&&!prompt){say(m,'Describe what you want to make first.','err');return}
    var ar=pressed($('shape')),len=parseInt(pressed($('len')),10),input;
    if(mode==='t2i')input={prompt:prompt,image_size:{'1:1':'square_hd','16:9':'landscape_16_9','9:16':'portrait_16_9'}[ar],num_images:1};
    else if(mode==='t2v')input={prompt:prompt,aspect_ratio:ar,duration:len};
    else input={prompt:prompt||'Gentle, natural motion',image_url:imgData,start_image_url:imgData,duration:len};
    busy=true;this.disabled=true;$('out').innerHTML='';say(m,'Sending request…');
    try{
      var res=await runSafe(cfg[mode],input,function(t){say(m,t+' Videos can take a few minutes.')});
      var url=fileUrl(res);if(!url)throw new Error('The service finished but returned no file.');
      var kind=mode==='t2i'?'image':'video';
      $('out').innerHTML=mediaEl(url,kind,true)+'<div class="row"><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener" download>Open or save</a></div>';
      addLib({kind:kind,prompt:prompt||'(animated image)',url:url,t:Date.now()});
      say(m,'Done. Saved to your Library.','ok');
    }catch(e){say(m,e.message||'Something went wrong.','err')}
    busy=false;this.disabled=false;
  });

  /* library */
  function renderLib(){
    var g=$('gal');g.innerHTML='';
    say($('libmsg'),lib.length?'Links come from fal.ai and may expire after a while, so save what you want to keep.':'Nothing here yet. Things you generate will show up here.');
    lib.forEach(function(it,i){
      var b=document.createElement('button');b.setAttribute('aria-label','Open '+it.kind+' '+(i+1));
      b.innerHTML=(it.kind==='image'?'<img alt="" src="'+esc(it.url)+'">':'<video src="'+esc(it.url)+'#t=0.1" muted playsinline preload="metadata"></video>')+'<span class="tag">'+(it.kind==='image'?'Image':'Video')+'</span>';
      b.addEventListener('click',function(){openViewer(i)});g.appendChild(b);
    });
  }
  function openViewer(i){
    var it=lib[i],v=$('viewer');v.hidden=false;
    v.innerHTML=mediaEl(it.url,it.kind,true)+'<p>'+esc(it.prompt)+'</p><div class="row"><a class="btn main" href="'+esc(it.url)+'" target="_blank" rel="noopener" download>Open or save</a><button class="btn del" id="vdel">Delete</button><button class="btn" id="vclose">Close</button></div>';
    $('vclose').onclick=function(){v.hidden=true;v.innerHTML=''};
    $('vdel').onclick=function(){lib.splice(i,1);lsSet('rw_lib',lib);v.hidden=true;v.innerHTML='';renderLib()};
  }

  /* story */
  var scenes=[],cur=0,playing=false,timer=0,raf=0,t0=0;
  function words(s){return s.split(/\s+/).filter(Boolean).length}
  $('sgo').addEventListener('click',async function(){
    if(busy)return;var m=$('smsg'),raw=$('script').value.trim();
    if(!cfg.key){say(m,'Add your fal.ai key in Settings first.','err');return}
    if(!raw){say(m,'Write a few lines for your story first.','err');return}
    var lines=raw.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);
    if(lines.length===1)lines=raw.split(/(?<=[.!?])\s+/).map(function(x){return x.trim()}).filter(Boolean);
    lines=lines.slice(0,10);
    var look=pressed($('sstyle')),ar=pressed($('sshape'));
    busy=true;this.disabled=true;stopPlay();$('player').hidden=true;scenes=[];
    try{
      for(var i=0;i<lines.length;i++){
        say(m,'Creating picture '+(i+1)+' of '+lines.length+'…');
        var res=await runSafe(cfg.t2i,{prompt:lines[i]+', '+look,image_size:{'1:1':'square_hd','16:9':'landscape_16_9','9:16':'portrait_16_9'}[ar],num_images:1},function(){});
        var url=fileUrl(res);if(!url)throw new Error('A scene came back without a picture.');
        scenes.push({text:lines[i],url:url,dur:Math.max(3,Math.min(10,Math.round(words(lines[i])/2.5)+1))});
      }
      say(m,'Story ready. Tap Play.','ok');
    }catch(e){say(m,(e.message||'Something went wrong.')+(scenes.length?' Showing the '+scenes.length+' scenes that finished.':''),'err')}
    if(scenes.length){var f=$('frame');f.style.aspectRatio=ar.replace(':','/');f.style.maxWidth=ar==='9:16'?'min(100%,340px)':'100%';$('player').hidden=false;cur=0;showScene(0,false);$('pb').style.width='0'}
    busy=false;this.disabled=false;
  });
  function showScene(i,anim){
    var s=scenes[i];
    $('frame').innerHTML='<img class="'+(anim?'kb':'')+'" style="--d:'+s.dur+'s" alt="Scene '+(i+1)+'" src="'+esc(s.url)+'"><div class="cap"'+($('caps').checked?'':' hidden')+'><span>'+esc(s.text)+'</span></div>';
  }
  function speak(t){if(!('speechSynthesis' in window)||!$('voice').checked)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
  function total(){return scenes.reduce(function(a,s){return a+s.dur},0)}
  function tick(){if(!playing)return;var b=scenes.slice(0,cur).reduce(function(a,s){return a+s.dur},0),el=Math.min(scenes[cur].dur,(Date.now()-t0)/1000);$('pb').style.width=((b+el)/total()*100)+'%';raf=requestAnimationFrame(tick)}
  function startScene(i){cur=i;showScene(i,true);t0=Date.now();speak(scenes[i].text);timer=setTimeout(function(){if(i+1<scenes.length)startScene(i+1);else{stopPlay();cur=0;showScene(0,false);$('pb').style.width='0'}},scenes[i].dur*1000)}
  function stopPlay(){clearTimeout(timer);cancelAnimationFrame(raf);playing=false;try{speechSynthesis.cancel()}catch(e){}$('play').textContent='Play'}
  $('play').addEventListener('click',function(){if(playing){stopPlay();return}playing=true;this.textContent='Pause';startScene(cur);tick()});
  $('caps').addEventListener('change',function(){var c=document.querySelector('.cap');if(c)c.hidden=!this.checked});
  if(!('speechSynthesis' in window)){$('voice').checked=false;$('voice').disabled=true}

})();
</script>
</body>
</html>
